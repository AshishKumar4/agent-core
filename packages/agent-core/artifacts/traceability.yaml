      "summary": "Host-supplied Principal, Actor, Tenant, caller-authentication, request-authentication, provenance, and bridge-authority inputs map to the intended qualified identities. Target-request exactness, typed transport provenance, historical issuance, and substitution rejection are modeled; concrete signatures, codecs, and identity extraction are not.",
      "status": "operational-assumption"
    },
    {
      "id": "ASM-CANONICAL-KEY-INJECTIVE",
      "summary": "Composite keys built by canonical-JSON encoding a component tuple are injective on that tuple. The encoder's quoting and escaping rules are not modeled, so this stands as an assumption rather than a result; the delimiter-join scheme is modeled and proved separately under AC-KEY-001.",
      "status": "operational-assumption"
    },
    {
      "id": "ASM-LIVENESS-TIME-INVALIDATION",
      "summary": "Modeled time advances monotonically. Eventual transport delivery, scheduling, and invalidation require explicit fairness assumptions only for liveness; no designated safety theorem assumes delivery, fairness, or progress.",
      "status": "operational-assumption"
    },
    {
      "id": "ASM-TRANSITION-ATOMICITY",
      "summary": "Only each owning-Actor transition is atomic: Tenant issuance linearizes locally, and target nonce consumption plus EffectAttempt/audit linearize locally. No cross-Actor atomic premise exists; concrete storage must establish each local transaction separately.",
      "status": "operational-assumption"
    },
    {
      "id": "ASM-ACTOR-LOCAL-ATOMICITY",
      "summary": "One Actor's own persistence linearizes its guarded transaction and applies it all-or-nothing. A commit whose outcome the caller never learns leaves the durable state at the base or at the complete commit, never a mixture, and rollback discards every staged write. SPEC 14 states this as an operational premise; SQLite and Durable Object storage stay in the trusted base, so AC-PERSISTENCE-001 assumes it rather than proving it, and every theorem there inherits it.",
      "status": "operational-assumption"
    },
    {
      "id": "ASM-SOURCE-PROJECTION-AUTHENTICITY",
      "summary": "The source Actor owns RouteReservation and the target accepts only an authenticated projection of that reservation.",
      "status": "operational-assumption"
    },
    {
      "id": "ASM-CLOSED-WORLD-TRANSITIONS",
      "summary": "The modeled transition and writer vocabularies are closed. Provider or storage operations may fail before or after a locally committed transition, including commit-unknown observations, but arbitrary Byzantine mutation, durable-record erasure, or corruption is outside the safety theorem boundary.",
      "status": "operational-assumption"
    },
    {
      "id": "ASM-IMPLEMENTATION-REFINEMENT-SEPARATE",
      "summary": "Implementation conformance is established separately by SPEC evidence and tests, never inferred from theorem names or checker success.",
      "status": "refinement-non-goal"
    }
  ],
  "nonClaims": [
    {
      "id": "NC-SURFACE-RUNTIME-ACTIONS",
      "summary": "Surface rendering, live-state isolation, action semantics, transport, and composition are specified but not modeled.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-PROFILE-RUNTIME",
      "summary": "Full profile and representation runtime semantics, UX, product behavior, and profile conformance are not formally claimed.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-RFC6902-PATCH",
      "summary": "RFC 6902 patch correctness and compatibility are not claimed by structural ViewPatch replay.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-FACET-MANIFEST-RUNTIME",
      "summary": "Facet manifest/runtime correspondence, operation implementation, profile loading, and declared-impact truth are not modeled.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-CONTRIBUTIONS-SLOTS",
      "summary": "The concrete default contribute-authority policy over real Facet installation state, slot visibility authority, concrete JSON-Schema validation, the viewer-filtered SlotCatalog query path, and surface-backed entry rendering are not modeled; the §4.2 declaration/origin collision rules, declared-order arrival-independent resolution, and the abstract contribute-authority gate itself are claimed under AC-SLOT-001.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-COMMANDS",
      "summary": "Concrete JSON-Schema compatibility checking, argument grammar and CLI parsing, completion providers, per-Scope alias and visibility configuration, dispatcher envelope gate ordering, and command.completed result rendering are not modeled; §4.3 collision rejection, derived-Subscription exactness, install-checked mappings, validated invocation input, and submission idempotency are claimed under AC-COMMAND-001.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-SECRET-PROCESS-ISOLATION",
      "summary": "SecretRef custody is not process isolation: §3.5 states that if plaintext is readable in an agent-visible filesystem, the ref does not protect it, so nothing beyond custody -- who may present a credential -- is claimed once a resolved value leaves the custody boundary. AC-SECRET-001 proves custody; process isolation of a resolved value is not modeled.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-INTERCEPTORS",
      "summary": "Runtime interceptor candidate discovery from installed contributions, durable trace persistence, transactional replay lookup, new-pass InvocationId allocation, and the prompt.assemble, input.submitted, and turn.step cut points are not modeled; operation cut-point ordering, execution, attribution, blocks, replay reuse, and the mediated-tier raise are claimed under AC-INTERCEPTOR-001.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-ENVIRONMENT-LIFECYCLE",
      "summary": "Concrete Environment provider behavior — container and process execution, provider reconciliation and inspection calls, snapshot content formats, preview-host token derivation, and device pairing and consent transport — is not modeled; the abstract Session lifecycle, credential-isolation, egress, and exposure rules are claimed only as AC-ENVIRONMENT-001.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-SLATE-RUNTIME",
      "summary": "Generated Slate application code, concrete deployment-provider effects, and per-app resource provisioning are not modeled; the abstract record-plane and dynamic-isolate authority rules are claimed only as AC-SLATE-001.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-CONTENTSTORE",
      "summary": "Concrete ContentStore put/get/stat transport and persistence, retention/GC policy timing, and the ContentRef wire representation are not modeled; tenant-bound resolution and the reachable unowned-only-collection invariant (C13-CONTENT-CUSTODY) are claimed under AC-CONTENT-001.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-CODECS",
      "summary": "Exact versioned record codecs, canonical encoding, tolerant reads, and upcasts are not modeled.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-PROTOCOL-DISPATCHER",
      "summary": "Concrete per-family authenticate/authority/lifecycle/expected-revision semantics, the raw envelope decoder's schema validation, and command.completed rendering are not modeled; the §8.5 fixed gate order, duplicate-never-mutates, exactly-one linked WriteRecord/AuditRecord per request, and the sound-and-complete executable mirror are claimed under AC-DISPATCHER-001.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-BLUEPRINT-MATERIALIZATION",
      "summary": "General Package and Blueprint validation, loading, contribution assembly, and materialization of Facet installs/Bindings/slots/policies/scope scaffolding are not modeled; Subscription-materialization idempotence -- re-materializing an already-installed template is a stored no-op, never a duplicate SubscriptionId -- is claimed under AC-MATERIALIZER-001.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-CLOUDFLARE-BEHAVIOR",
      "summary": "AC-COMPOSED-001 models an abstract distributed authority-permit protocol, not the concrete Cloudflare record, signatures, codecs, Durable Object transactions, storage failure semantics, network/RPC implementation, topology, bundle, configuration, or deployment behavior.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-TEMPORAL-LIVENESS",
      "summary": "Temporal delivery, fairness, scheduling, reconciliation progress, and eventual invalidation are not proved.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-CRYPTOGRAPHIC-COLLISION-RESISTANCE",
      "summary": "Cryptographic digest collision resistance is not proved; InvocationDigest is ideal structural identity.",
      "status": "specified-not-modeled"
    },
    {
      "id": "NC-DIFFERENTIAL-EMPIRICAL",
      "summary": "Agreement between an implementation and an executable model definition — the differential oracle suites, property tests, and mutation measurement — is empirical evidence over the inputs actually exercised. It is a refutation instrument: a disagreement is a genuine semantic divergence, while agreement bounds nothing outside the tested domain and is not a refinement proof. No designated theorem depends on any such run, and no proved status anywhere in this ledger is earned by one.",
      "status": "refinement-non-goal"
    },
    {
      "id": "NC-TYPESCRIPT-SUBSTRATE-REFINEMENT",
      "summary": "No TypeScript, adapter, substrate, provider, deployment, profile, or product is proved to refine the Lean model.",
      "status": "refinement-non-goal"
    }
  ],
