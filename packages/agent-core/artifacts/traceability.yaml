      "summary": "Valid Run pins/migration, stable-identity admission reserve/complete/close, exact outstanding frontier, sibling cancellation, settlement, and acceptance criteria reserved at Run open, never completed, and evaluated at settlement against the Run's current head tree by a verdict of the criterion's own declared verifier",
      "status": "proved-component",
      "boundary": "RunPins validate Agent identity and unique closure at creation and migration; source-record resolvability remains external. Registry obligations contain only pre-remote Approval, item-key, route, attempt, planned-commit, or acceptance-criterion identities; completion is reserved-only, and terminalization snapshots exactly reserved minus completed with membership equivalence. Acceptance criteria are declared on the Run record with store-wide distinct identities, reserved by the startRun and spawnChild transitions, and refused by the generic reserve and complete transitions; no transition completes one, so a declared criterion stays outstanding for the Run's whole life and is snapshotted at terminalization. Recording a verdict requires an attempted Receipt of the criterion's own declared verifier Operation and a subject no recorded verdict names. Settlement evaluates the criterion against the Run's current root-branch head tree checkpoint, so a stale verdict does not settle a Run whose head has moved. The four invariants are preserved by every GraphStep and therefore by every reachable graph, so a Settled Run's every declared criterion holds a verdict at its current head backed by a succeeded Receipt of its own verifier. The settlement pair is exhibited on a graph reached from the empty graph by seven GraphSteps -- open, verdict, reserve, start Turn, claim, begin terminalization against a succeeded administer Receipt with its own audit chain, terminalize -- so one object is both reachable and Settled, and the same trace with the verdict naming a tree the head moved past is reachable and not Settled. The verifier Receipt's own domain binding and audit chain are still not required by AcceptanceSatisfied, only exhibited by that witness, and concrete remote reservation enforcement and durable transactions remain refinement obligations. Resource ceilings are not modeled: no monotone-attenuation or exhaustion-cancellation claim.",
