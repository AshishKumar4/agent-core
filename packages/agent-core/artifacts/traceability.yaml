      "id": "AC-KEY-001",
      "summary": "When a stored delimiter-joined composite key determines the identity it was built from",
      "status": "proved-safety",
      "boundary": "Two-component delimiter joins only. Injectivity is proved for a delimiter-free left component and, separately, for a delimiter-free right one; the join is proved not injective when neither side is constrained, and the prefix scan built from it is proved to admit a foreign identifier's key under the same condition — both by explicit construction, for every delimiter. What this does not do is decide any particular stored key: it states the obligation an implementation must discharge per key by naming the delimiter-free side and showing its component domain excludes the delimiter. Canonical-JSON composite keys are a different scheme whose injectivity rests on the encoder's escaping rules; those are not modeled here and stand as ASM-CANONICAL-KEY-INJECTIVE. Joins of more than two components, ordering, and storage behavior are outside this requirement.",
