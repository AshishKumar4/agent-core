      "id": "AC-COMPOSED-001",
      "summary": "Direct admission, non-attempt mediated preparation, distributed target-request and Tenant-permit attempt admission, exact mediated reservation and approval identity, and coherent settlement",
      "status": "proved-safety",
      "boundary": "The distributed LTS separates a target-owned immutable request, Tenant-local issuance from Tenant authority plus the authenticated request payload, typed lossy/duplicating/reordering transport, volatile target authentication, and target-local nonce-consume plus EffectAttempt/audit atomicity. No cross-Actor atomic premise exists. Issuance is the only authoritative Grant/Binding/path comparison; authentication and consumption use transported evidence and target-local request, fence, time, claim, reservation, lease, route, and audit state without reading issuer storage. Attempt-producing mediated labels are excluded from the generic mediated SystemStep; every reachable EffectAttempt therefore has an exact target request, exact historical Tenant issuance, exact target consumption, and matching attempt. No Actor-local boolean or claimed authority admission is modeled. A future Actor-local attempt path remains possible only when canonical authority ownership permits the comparison and attempt write in one owner transaction. Reset invalidates volatile authentication; expired permits and changed target fences cannot consume; and separate before/after commit-unknown traces distinguish no-commit from committed issuance and consumption. Live authority administration and role rematerialization are absent until a capability-mediated path is modeled; raw AuthorityStep is not a runtime authorization boundary. This is an abstract protocol over the modeled PreparedInvocation/claim/reservation/binding fields, not the complete §10.3 wire record or any TypeScript, storage, signature, provider, or deployment refinement. Direct admission and settlement retain their prior narrow boundaries.",
