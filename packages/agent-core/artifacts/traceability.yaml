    {
      "id": "AC-PERSISTENCE-001",
      "summary": "Actor-local persistence: the transaction boundary, rollback, uniqueness, restart, and commit-unknown",
      "status": "proved-safety",
      "boundary": "One Actor's own storage, as a concrete machine with an open transaction holding the storage it opened against and the writes staged so far. durable_state_refines_the_atomic_actor is the refinement: every reachable concrete storage is one the atomic machine -- where a transaction is a single state change -- also reaches, so a crash at any point recovers a state the rest of this package describes and no partially applied transaction is ever durable. That rests on reachable_transaction_anchored, which holds only because a transaction cannot open over an open one; nonvacuous_actor_nested_commit_loses_a_write exhibits the lost write the guard excludes. activateExec is the modeled activation decision in the implementation's own precedence, and the transition system admits an activation exactly when it succeeds. What the abstraction does not carry: atomicity itself. The two-branch semantics of commitUnknown -- the durable outcome is the base or the whole commit, never a mixture -- is the modeled form of SPEC 14's substrate premise, registered as ASM-ACTOR-LOCAL-ATOMICITY, and every theorem here inherits it; SQLite and Durable Object storage stay in the trusted base. Nor does it carry the mailbox: commands are modeled as a gate over durable state, so serialization, ordering, and the closing-before-closed latch are not results here. The journal is a list of opaque record identifiers, so append-only is proved for the log's shape and nothing is claimed about record content, codecs, or keys -- a stored recovery record whose payload disagrees with its key is exactly AC-KEY-001's obligation, and appears here only as the foreignRecovery fault. The Actor abstraction is single-storage and single-Actor throughout; cross-Actor atomicity remains excluded by ASM-TRANSITION-ATOMICITY. TypeScript refinement is empirical only (NC-DIFFERENTIAL-EMPIRICAL).",
