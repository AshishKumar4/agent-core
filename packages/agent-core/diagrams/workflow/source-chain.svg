<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">Artifact identity chain</title>
  <desc id="desc">A controlled requirement binds to Lean source, generated TypeScript, and the deployed bundle. The edge labels name the evidence that binds each artifact to the previous one.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7A8494"/></marker>
  </defs>
  <rect width="980" height="300" rx="16" fill="#FBFBFC" stroke="#E3E6EB"/>
  <g font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
    <text x="38" y="50" font-size="18" font-weight="650" fill="#1F2733">Artifact identity chain</text>

    <g transform="translate(42 108)" text-anchor="middle">
      <g><rect width="184" height="82" rx="12" fill="#F2EDFA" stroke="#9B7FC7"/><text x="92" y="32" font-size="13" font-weight="650" fill="#1F2733">Controlled requirement</text><text x="92" y="53" font-size="10.5" fill="#5A6472">reviewed formal intent</text></g>
      <g transform="translate(236)"><rect width="184" height="82" rx="12" fill="#EEF1FB" stroke="#7A8BD0"/><text x="92" y="32" font-size="13" font-weight="650" fill="#1F2733">Lean source</text><text x="92" y="53" font-size="10.5" fill="#5A6472">model · proof · program</text></g>
      <g transform="translate(472)"><rect width="184" height="82" rx="12" fill="#E9F5F2" stroke="#5FA99B"/><text x="92" y="32" font-size="13" font-weight="650" fill="#1F2733">Generated TypeScript</text><text x="92" y="53" font-size="10.5" fill="#5A6472">generated bytes</text></g>
      <g transform="translate(708)"><rect width="184" height="82" rx="12" fill="#FBF3E4" stroke="#C9A15E"/><text x="92" y="32" font-size="13" font-weight="650" fill="#1F2733">Deployed bundle</text><text x="92" y="53" font-size="10.5" fill="#5A6472">exact attested bytes</text></g>
    </g>

    <g stroke="#7A8494" stroke-width="1.5" marker-end="url(#arrow)">
      <line x1="226" y1="149" x2="276" y2="149"/><line x1="462" y1="149" x2="512" y2="149"/><line x1="698" y1="149" x2="748" y2="149"/>
    </g>
    <g font-size="10.5" fill="#5A6472" text-anchor="middle">
      <text x="251" y="96">digest + bridge</text><text x="487" y="96">proof manifest</text><text x="723" y="96">build attestation</text>
    </g>

    <rect x="230" y="230" width="520" height="38" rx="9" fill="#F9ECEF" stroke="#E8D6DB"/>
    <text x="490" y="254" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="650" fill="#7A3F50" text-anchor="middle">Hash mismatch: release gate rejects edited output.</text>
  </g>
</svg>
